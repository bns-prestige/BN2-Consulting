<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050d1a;--ink:#e8f0ff;--muted:#8fa3c4;--card:rgba(255,255,255,.045);--line:rgba(140,170,255,.16);--a:#4fd8ff;--b:#8b7cff;--btn-ink:#04121c;--hbg:rgba(5,13,26,.72);--glow:rgba(79,216,255,.2);--ok:#6ff0b0}}
:root[data-theme="dark"]{--bg:#050d1a;--ink:#e8f0ff;--muted:#8fa3c4;--card:rgba(255,255,255,.045);--line:rgba(140,170,255,.16);--a:#4fd8ff;--b:#8b7cff;--btn-ink:#04121c;--hbg:rgba(5,13,26,.72);--glow:rgba(79,216,255,.2);--ok:#6ff0b0}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:80px;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--hbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
h1,h2,h3{font-family:Sora,Manrope,system-ui,sans-serif;margin:0;letter-spacing:-.03em;line-height:1.05}
a{color:inherit}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--a);top:-25vmax;right:-15vmax;opacity:.28}
.aurora i:nth-child(2){background:var(--b);bottom:-30vmax;left:-20vmax;opacity:.28;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.spot{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,30%),var(--glow),transparent 70%)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;position:relative;z-index:1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--hbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:12px}
.logo{font:800 1.3rem Sora,sans-serif;text-decoration:none;letter-spacing:-.04em;white-space:nowrap}
.logo span,.grad{background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;align-items:center;overflow-x:auto;margin-left:auto}
nav a{text-decoration:none;color:var(--muted);padding:8px 14px;border-radius:999px;font-size:.95rem;white-space:nowrap;transition:color .2s,background .2s}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.lang{display:flex;gap:2px;padding:3px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);background:var(--card)}
.lang button{font:600 .82rem Manrope,sans-serif;color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:linear-gradient(135deg,var(--a),var(--b));color:var(--btn-ink)}
.btn{display:inline-block;background:linear-gradient(135deg,var(--a),var(--b));color:var(--btn-ink);font:600 1rem Manrope,sans-serif;text-decoration:none;padding:15px 26px;border-radius:12px;border:0;cursor:pointer;box-shadow:0 10px 34px -10px var(--a);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px -10px var(--a)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
:focus-visible{outline:3px solid var(--a);outline-offset:3px}
.view{display:none;position:relative;z-index:1}
.view.on{display:block}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
.hero{padding:104px 0 96px}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(2.8rem,6.6vw,5.4rem);font-weight:800}
.lead{font-size:1.2rem;color:var(--muted);max-width:32em;margin:26px 0 34px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;transition:border-color .25s,transform .15s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(300px circle at var(--cx,50%) var(--cy,50%),var(--glow),transparent 65%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover{border-color:var(--a)}
.card:hover::before{opacity:1}
.term h3{font:500 .92rem Manrope,sans-serif;color:var(--muted);margin-bottom:16px;letter-spacing:0;display:flex;gap:7px;align-items:center}
.term h3 i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.msg{padding:13px 15px;border-radius:12px;margin-bottom:10px;font-size:.98rem;opacity:0;animation:pop .5s ease forwards}
.msg small{display:block;font-size:.8rem;opacity:.7;margin-bottom:2px}
.msg.q{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);animation-delay:.5s}
.msg.a{background:linear-gradient(135deg,var(--a),var(--b));color:var(--btn-ink);animation-delay:1.5s}
.state{font-size:.9rem;color:var(--muted);opacity:0;animation:pop .5s 2.4s ease forwards}
.state b{color:var(--ok)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.marq{overflow:hidden;border-block:1px solid var(--line);background:var(--card);position:relative;z-index:1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq div{display:flex;gap:48px;width:max-content;padding:16px 0;animation:mq 36s linear infinite;font:700 1.15rem Sora,sans-serif;color:var(--muted)}
.marq span::after{content:"";display:inline-block;width:7px;height:7px;margin-left:48px;border-radius:50%;background:var(--a);vertical-align:middle}
@keyframes mq{to{transform:translateX(-50%)}}
.page-head{padding:88px 0 40px}
.page-head h1{font-size:clamp(2.3rem,5.4vw,4.2rem);font-weight:800;max-width:14em}
.page-head p,.sub{color:var(--muted);max-width:36em;margin:18px 0 0;font-size:1.15rem}
section{padding:56px 0 72px}
h2{font-size:clamp(1.7rem,3.4vw,2.5rem);font-weight:800;max-width:17em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.grid .card h3{font-size:1.25rem;margin-bottom:8px}
.grid .card p{margin:0;color:var(--muted);font-size:1rem}
a.card{text-decoration:none;display:block}
.steps{list-style:none;padding:0;margin:0;counter-reset:s;display:grid;gap:16px}
.steps li{counter-increment:s;display:grid;grid-template-columns:84px 1fr;gap:20px;align-items:center}
.steps li::before{content:counter(s);font:800 3.2rem/1 Sora,sans-serif;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.steps h3{font-size:1.4rem;margin-bottom:4px}
.steps p{margin:0;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.two p{margin:0 0 16px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding:0;list-style:none}
.pills li{border:1px solid var(--line);background:var(--card);padding:9px 17px;border-radius:999px}
.mail{font:800 clamp(1.2rem,3vw,1.7rem) Sora,sans-serif;display:inline-block;margin-top:20px;word-break:break-all}
form{display:grid;gap:14px}
label{font-weight:500;font-size:.95rem;display:grid;gap:6px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;width:100%}
input:focus,textarea:focus{border-color:var(--a);outline:none;box-shadow:0 0 0 3px var(--glow)}
textarea{min-height:140px;resize:vertical}
.cta{padding:0 0 80px;position:relative;z-index:1}
.cta[hidden]{display:none}
.cta .card{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding:36px}
.cta h2{font-size:1.7rem}
footer{position:relative;z-index:1;padding:28px 0;color:var(--muted);font-size:.92rem;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:860px){
.hero .wrap,.two{grid-template-columns:1fr;gap:36px}
.hero{padding:56px 0 64px}
.grid,.grid.g2{grid-template-columns:1fr}
.steps li{grid-template-columns:56px 1fr}
.steps li::before{font-size:2.2rem}
header .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
nav{order:3;width:100%;margin-left:0}
.lang{margin-left:auto}
.page-head{padding-top:56px}}
@media (prefers-reduced-motion:reduce){.aurora i,.marq div,.msg,.state{animation:none;opacity:1}.rv{opacity:1;transform:none;transition:none}}
</style>
</head>

var L='fr',views=['accueil','services','methode','a-propos','contact','ia'],$=function(i){return document.getElementById(i)};
try{var sv=localStorage.getItem('bn2lang');if(D[sv])L=sv;else if(/^nl/i.test(navigator.language))L='nl';else if(/^en/i.test(navigator.language))L='en'}catch(e){}
var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function cards(el,list,tag,href){el.innerHTML=list.map(function(s){return '<'+tag+(tag==='a'?' href="'+(href||'#services')+'"':'')+' class="card tilt rv"><h3>'+s[0]+'</h3><p>'+s[1]+'</p></'+tag+'>'}).join('')}
function scramble(el){
if(RM)return;
if(!el.dataset.t)el.dataset.t=el.innerHTML;
var html=el.dataset.t,tmp=document.createElement('div');tmp.innerHTML=html;
var plain=tmp.textContent,n=0,ch='abcdefghijklmnopqrstuvwxyz0123456789#%&';
clearInterval(el._i);
el._i=setInterval(function(){
n+=2.2;
if(n>=plain.length){el.innerHTML=html;clearInterval(el._i);return}
var out='';for(var k=0;k<plain.length;k++){var c=plain[k];out+=k<n||c===' '?c:ch[Math.floor(Math.random()*ch.length)]}
el.textContent=out;
},28);
}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
function obs(){document.querySelectorAll('.rv:not(.in)').forEach(function(e,i){e.style.transitionDelay=(i%3)*90+'ms';io.observe(e)})}
function apply(){
var T=D[L];document.documentElement.lang=L;
document.querySelectorAll('[data-i]').forEach(function(e){e.innerHTML=T[e.dataset.i];delete e.dataset.t});
cards($('homeGrid'),T.S.slice(0,6),'a');cards($('allGrid'),T.S,'div');cards($('cGrid'),T.C,'div');cards($('aiHome'),T.A.slice(0,3),'a','#ia');cards($('iaGrid'),T.A,'div');
$('steps').innerHTML=T.P.map(function(s){return '<li class="rv"><div class="card"><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div></li>'}).join('');
$('pills').innerHTML=T.Q.map(function(q){return '<li>'+q+'</li>'}).join('');
var m=T.S.map(function(s){return '<span>'+s[0]+'</span>'}).join('');$('mq').innerHTML=m+m;
document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===L)});
obs();show(true);
}
function show(keep){
var h=location.hash.slice(1);if(views.indexOf(h)<0)h='accueil';
views.forEach(function(v){$(v).classList.toggle('on',v===h)});
document.querySelectorAll('#nav a').forEach(function(a){if(a.getAttribute('href')==='#'+h)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
document.title='BN2 Consulting'+(h==='accueil'?'':' – '+D[L]['n'+(views.indexOf(h)+1)]);
$('cta').hidden=h==='contact';
if(keep!==true)window.scrollTo(0,0);
var t=$(h).querySelector('[data-scr]');if(t)scramble(t);
}
addEventListener('hashchange',function(){show()});
document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){L=b.dataset.l;try{localStorage.setItem('bn2lang',L)}catch(e){}apply()})});
apply();

var fine=matchMedia('(pointer:fine)').matches;
document.addEventListener('pointermove',function(e){
var r=document.documentElement.style;r.setProperty('--mx',e.clientX+'px');r.setProperty('--my',e.clientY+'px');
var c=e.target.closest&&e.target.closest('.card');
if(c){var b=c.getBoundingClientRect();c.style.setProperty('--cx',e.clientX-b.left+'px');c.style.setProperty('--cy',e.clientY-b.top+'px');
if(fine&&!RM&&c.classList.contains('tilt')){var x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;c.style.transition='transform .08s';c.style.transform='perspective(800px) rotateX('+(-y*7)+'deg) rotateY('+(x*9)+'deg) translateY(-3px)'}}
});
document.addEventListener('pointerout',function(e){var c=e.target.closest&&e.target.closest('.tilt');if(c){c.style.transition='transform .4s';c.style.transform=''}});

var cv=$('net'),cx=cv.getContext('2d'),P=[],W,H,mx=-999,my=-999;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;var n=Math.min(70,Math.floor(W*H/22000));P=[];for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35})}
size();addEventListener('resize',size);
addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY});
function draw(){
var col=getComputedStyle(document.documentElement).getPropertyValue('--a').trim()||'#4fd8ff';
cx.clearRect(0,0,W,H);cx.fillStyle=col;cx.strokeStyle=col;
for(var i=0;i<P.length;i++){var p=P[i];
if(!RM){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
cx.globalAlpha=.55;cx.beginPath();cx.arc(p.x,p.y,1.6,0,6.3);cx.fill();
for(var j=i+1;j<P.length;j++){var q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<130){cx.globalAlpha=(1-d/130)*.25;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}
var dm=Math.hypot(p.x-mx,p.y-my);if(dm<170){cx.globalAlpha=(1-dm/170)*.5;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(mx,my);cx.stroke()}
}
if(!RM)requestAnimationFrame(draw)
}
draw();

location.href='mailto:consultingbn2@gmail.com?subject='+encodeURIComponent(T.subj)+'&body='+encodeURIComponent(body);
